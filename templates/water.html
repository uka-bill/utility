<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Utility - Direct Bill Entry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS identical to electricity.html – for brevity, I'm assuming you already have it ===== */
        /* I will include the full CSS in the final file, but for this response I'll show only the script changes */
    </style>
</head>
<body>
    <!-- Same navbar and container structure as electricity.html -->
    <script>
        // ========== NUMBER FORMATTING HELPERS ==========
        function formatNumberWithCommas(num) {
            if (num === undefined || num === null || isNaN(num)) return '0.00';
            return Number(num).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatConsumption(num) {
            if (num === undefined || num === null || isNaN(num)) return '0';
            return Number(num).toLocaleString('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        function parseNumberFromDisplay(str) {
            if (!str) return 0;
            const cleaned = String(str).replace(/,/g, '').trim();
            return parseFloat(cleaned) || 0;
        }

        // ========== MAIN SCRIPT ==========
        let allSchools = [];
        let allDepartments = [];
        let existingBills = [];
        let currentMonth = new Date().getMonth() + 1;
        let currentYear = new Date().getFullYear();
        let isLoading = false;
        let savingEntities = new Set();
        let activeSavingToast = null;
        let savedScrollPosition = 0;

        function saveScrollPosition() {
            const wrapper = document.querySelector('.table-wrapper');
            if (wrapper) savedScrollPosition = wrapper.scrollTop;
        }

        function restoreScrollPosition() {
            const wrapper = document.querySelector('.table-wrapper');
            if (wrapper && savedScrollPosition > 0) {
                setTimeout(() => wrapper.scrollTop = savedScrollPosition, 50);
            }
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('active', show);
        }

        function showSavingToast(entityName) {
            if (activeSavingToast) activeSavingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'saving-toast';
            toast.innerHTML = '<span class="saving-spinner"></span> Saving ' + entityName + '... Please wait';
            document.body.appendChild(toast);
            activeSavingToast = toast;
            return toast;
        }

        function hideSavingToast() {
            if (activeSavingToast) { activeSavingToast.remove(); activeSavingToast = null; }
        }

        function showToast(message, isError) {
            if (isError === undefined) isError = false;
            const toast = document.createElement('div');
            toast.className = isError ? 'error-toast' : 'success-toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 4000);
        }

        function populateYears() {
            const yearSelect = document.getElementById('globalYear');
            yearSelect.innerHTML = '';
            const start = 2020, end = 2035;
            for (let y = start; y <= end; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }
        }

        async function loadAllEntities() {
            try {
                const [schoolsRes, deptsRes] = await Promise.all([
                    fetch('/api/schools'),
                    fetch('/api/departments')
                ]);
                if (schoolsRes.ok) allSchools = await schoolsRes.json();
                if (deptsRes.ok) allDepartments = await deptsRes.json();
            } catch(e) {
                console.error('Error loading entities:', e);
            }
        }

        async function loadExistingBills(month, year) {
            try {
                const url = '/api/utility-bills?utility_type=water&month=' + month + '&year=' + year;
                const resp = await fetch(url);
                if (resp.ok) {
                    existingBills = await resp.json();
                    console.log('📊 Loaded ' + existingBills.length + ' water bills for ' + month + '/' + year);
                } else {
                    existingBills = [];
                    console.warn('⚠️ Failed to load bills, status:', resp.status);
                }
            } catch(e) {
                console.error('Error loading bills:', e);
                existingBills = [];
            }
        }

        function extractWaterAccounts(entity) {
            let accounts = [];
            try {
                if (entity.water_accounts && typeof entity.water_accounts === 'string') {
                    const parsed = JSON.parse(entity.water_accounts);
                    if (Array.isArray(parsed) && parsed.length > 0) accounts = parsed;
                } else if (entity.water_accounts && Array.isArray(entity.water_accounts)) {
                    accounts = entity.water_accounts;
                } else if (entity.water_account && entity.water_account !== '—') {
                    const meters = [];
                    if (entity.water_meter && entity.water_meter !== '—') {
                        meters.push({ meterNumber: entity.water_meter, location: '', notes: '' });
                    } else {
                        meters.push({ meterNumber: '', location: '', notes: '' });
                    }
                    accounts = [{ accountNumber: entity.water_account, meters: meters }];
                }
            } catch(e) {
                console.error('Error parsing water accounts:', e);
            }
            return accounts;
        }

        function buildEntityList() {
            const entities = [];
            for (let idx = 0; idx < allSchools.length; idx++) {
                const school = allSchools[idx];
                const accounts = extractWaterAccounts(school);
                let accountGroups = accounts;
                let hasAccounts = accounts.length > 0;
                if (!hasAccounts) {
                    accountGroups = [{
                        accountNumber: '—',
                        meters: [{ meterNumber: '', location: '', notes: '' }],
                        isPlaceholder: true
                    }];
                }
                let cluster = school.cluster_number ? 'CLUSTER ' + school.cluster_number : 'Unassigned';
                entities.push({
                    id: school.id,
                    name: school.name || 'School #' + school.id,
                    type: 'school',
                    typeLabel: '🏫 School',
                    clusterNumber: cluster,
                    departmentName: null,
                    divisionName: null,
                    displayOrder: school.display_order || 999,
                    originalId: school.id,
                    accountGroups: accountGroups,
                    hasAccounts: hasAccounts
                });
            }
            for (let idx = 0; idx < allDepartments.length; idx++) {
                const dept = allDepartments[idx];
                const accounts = extractWaterAccounts(dept);
                let accountGroups = accounts;
                let hasAccounts = accounts.length > 0;
                if (!hasAccounts) {
                    accountGroups = [{
                        accountNumber: '—',
                        meters: [{ meterNumber: '', location: '', notes: '' }],
                        isPlaceholder: true
                    }];
                }
                const displayName = dept.unit_name || dept.department_name || dept.name || 'Dept #' + dept.id;
                entities.push({
                    id: dept.id,
                    name: displayName,
                    type: 'department',
                    typeLabel: '🏛️ Department',
                    clusterNumber: null,
                    departmentName: dept.department_name || 'Other',
                    divisionName: dept.division_name || 'Other',
                    displayOrder: dept.display_order || 999,
                    originalId: dept.id,
                    accountGroups: accountGroups,
                    hasAccounts: hasAccounts
                });
            }
            return entities;
        }

        function matchesSearch(entity, searchTerm) {
            if (!searchTerm) return true;
            const term = searchTerm.toLowerCase();
            if (entity.name.toLowerCase().includes(term)) return true;
            for (let a = 0; a < entity.accountGroups.length; a++) {
                const account = entity.accountGroups[a];
                if (account.accountNumber && account.accountNumber !== '—' && account.accountNumber.toLowerCase().includes(term)) return true;
                if (account.meters) {
                    for (let m = 0; m < account.meters.length; m++) {
                        const meter = account.meters[m];
                        if (meter.meterNumber && meter.meterNumber !== '—' && meter.meterNumber.toLowerCase().includes(term)) return true;
                    }
                }
            }
            return false;
        }

        // ========== Save functions ==========
        async function saveEntityDataBackground(entityRow, month, year) {
            const startTime = performance.now();
            if (isLoading) return;
            const entityId = parseInt(entityRow.getAttribute('data-entity-id'));
            const entityType = entityRow.getAttribute('data-entity-type');
            const entityName = entityRow.getAttribute('data-entity-name');
            if (savingEntities.has(entityId)) { showToast('Already saving...', true); return; }
            showSavingToast(entityName);

            let meterRows = [];
            let nextRow = entityRow.nextElementSibling;
            while (nextRow) {
                if (nextRow.classList && nextRow.classList.contains('entity-row')) break;
                if (nextRow.classList && nextRow.classList.contains('meter-row')) meterRows.push(nextRow);
                nextRow = nextRow.nextElementSibling;
            }
            if (meterRows.length === 0) { showToast('No data to save', true); hideSavingToast(); return; }

            const saveBtn = entityRow.querySelector('.save-entity-btn');
            const originalBtnText = saveBtn ? saveBtn.innerHTML : 'Save All';
            if (saveBtn) { saveBtn.innerHTML = '<span class="saving-indicator"></span> Saving...'; saveBtn.disabled = true; }
            meterRows.forEach(row => {
                row.querySelectorAll('.inline-input').forEach(input => input.classList.add('saving'));
            });

            const batchBills = [];
            for (let i = 0; i < meterRows.length; i++) {
                const row = meterRows[i];
                const accountNumber = row.getAttribute('data-account') || '';
                const meterNumber = row.getAttribute('data-meter') || '';
                const existingBillId = null;
                const consumptionInput = row.querySelector('.consumption-input');
                const currentInput = row.querySelector('.current-charge-input');
                const outstandingInput = row.querySelector('.outstanding-input');
                const previousPaidInput = row.querySelector('.previous-paid-input');
                const amountPaidInput = row.querySelector('.amount-paid-input');
                const notesInput = row.querySelector('.notes-input');
                const consumption = parseNumberFromDisplay(consumptionInput ? consumptionInput.value : 0);
                const currentCharges = parseNumberFromDisplay(currentInput ? currentInput.value : 0);
                const unsettledCharges = parseNumberFromDisplay(outstandingInput ? outstandingInput.value : 0);
                const previousPayment = parseNumberFromDisplay(previousPaidInput ? previousPaidInput.value : 0);
                const amountPaid = parseNumberFromDisplay(amountPaidInput ? amountPaidInput.value : 0);
                const notes = notesInput ? notesInput.value : '';
                batchBills.push({
                    id: existingBillId,
                    account_number: accountNumber === '—' ? '' : accountNumber.trim(),
                    meter_number: meterNumber === '—' ? '' : meterNumber.trim(),
                    consumption_m3: consumption,
                    current_charges: currentCharges,
                    unsettled_charges: unsettledCharges,
                    amount_paid: amountPaid,
                    notes: JSON.stringify({ previousPayment: previousPayment, originalNotes: notes }),
                    month: month,
                    year: year,
                    entity_type: entityType,
                    entity_id: entityId,
                    utility_type: 'water'
                });
            }

            savingEntities.add(entityId);
            try {
                const resp = await fetch('/api/utility-bills/batch-update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bills: batchBills })
                });
                const result = await resp.json();
                const totalTime = (performance.now() - startTime).toFixed(0);
                meterRows.forEach(row => {
                    row.querySelectorAll('.inline-input').forEach(input => {
                        input.classList.remove('saving');
                        input.classList.add('saved');
                        setTimeout(() => input.classList.remove('saved'), 2000);
                    });
                });
                hideSavingToast();
                if (result.success) {
                    showToast(entityName + ': Saved ' + result.success_count + ' record(s) successfully (' + totalTime + 'ms)', false);
                    await loadExistingBills(month, year);
                    updateEntityTotalDisplay(entityId, batchBills);
                } else {
                    showToast(entityName + ': Saved ' + result.success_count + ' records, ' + result.error_count + ' failed', true);
                }
            } catch (err) {
                console.error('Save error:', err);
                meterRows.forEach(row => {
                    row.querySelectorAll('.inline-input').forEach(input => input.classList.remove('saving'));
                });
                hideSavingToast();
                showToast('Network error. Please try again.', true);
            } finally {
                savingEntities.delete(entityId);
                if (saveBtn) { saveBtn.innerHTML = originalBtnText; saveBtn.disabled = false; }
                isLoading = false;
            }
        }

        function updateEntityTotalDisplay(entityId, batchBills) {
            let totalPaid = 0;
            for (let i = 0; i < batchBills.length; i++) totalPaid += batchBills[i].amount_paid || 0;
            const entityTotalSpan = document.getElementById('entity-total-' + entityId);
            if (entityTotalSpan) entityTotalSpan.innerHTML = '(Total Paid: $' + formatNumberWithCommas(totalPaid) + ')';
            const entityStatusSpan = document.getElementById('entity-status-' + entityId);
            if (entityStatusSpan) {
                if (totalPaid > 0) {
                    entityStatusSpan.innerHTML = 'Paid';
                    entityStatusSpan.className = 'status-badge status-paid';
                } else {
                    entityStatusSpan.innerHTML = 'Pending';
                    entityStatusSpan.className = 'status-badge status-pending';
                }
            }
        }

        // ========== Render Table ==========
        async function renderWaterTable() {
            const month = parseInt(document.getElementById('globalMonth').value);
            const year = parseInt(document.getElementById('globalYear').value);
            currentMonth = month;
            currentYear = year;
            const tbody = document.getElementById('billsTableBody');
            tbody.innerHTML = '<tr><td colspan="12" class="no-data">Loading data...</td></tr>';

            await loadAllEntities();
            await loadExistingBills(month, year);

            let allEntities = buildEntityList();
            const entityFilter = document.getElementById('entityTypeFilter').value;
            const searchTerm = document.getElementById('searchFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            let filteredEntities = [];
            for (let i = 0; i < allEntities.length; i++) {
                const entity = allEntities[i];
                if (entityFilter !== 'all' && entity.type !== entityFilter) continue;
                if (searchTerm && !matchesSearch(entity, searchTerm)) continue;
                filteredEntities.push(entity);
            }
            if (filteredEntities.length === 0) {
                tbody.innerHTML = '<tr class="no-data-row"><td colspan="12" class="no-data">No matching entities found.</td></tr>';
                restoreScrollPosition();
                isLoading = false;
                return;
            }

            tbody.innerHTML = '';
            let globalSerial = 1;
            let entityNumber = 1;

            let schoolsList = filteredEntities.filter(e => e.type === 'school');
            let departmentsList = filteredEntities.filter(e => e.type === 'department');

            schoolsList.sort((a, b) => {
                const clusterA = a.clusterNumber ? parseInt(a.clusterNumber.replace('CLUSTER ', '')) : 999;
                const clusterB = b.clusterNumber ? parseInt(b.clusterNumber.replace('CLUSTER ', '')) : 999;
                if (clusterA !== clusterB) return clusterA - clusterB;
                const orderA = a.displayOrder !== undefined ? a.displayOrder : 999;
                const orderB = b.displayOrder !== undefined ? b.displayOrder : 999;
                if (orderA !== orderB) return orderA - orderB;
                return (a.originalId || a.id) - (b.originalId || b.id);
            });

            const deptMap = new Map();
            departmentsList.forEach(dept => {
                const deptName = dept.departmentName || 'Other';
                const divName = dept.divisionName || 'Other';
                if (!deptMap.has(deptName)) deptMap.set(deptName, new Map());
                const divMap = deptMap.get(deptName);
                if (!divMap.has(divName)) divMap.set(divName, []);
                divMap.get(divName).push(dept);
            });

            const sortedDeptNames = Array.from(deptMap.keys()).sort((a, b) => {
                const deptA = deptMap.get(a), deptB = deptMap.get(b);
                const minOrderA = Math.min(...Array.from(deptA.values()).flat().map(d => d.displayOrder !== undefined ? d.displayOrder : 999));
                const minOrderB = Math.min(...Array.from(deptB.values()).flat().map(d => d.displayOrder !== undefined ? d.displayOrder : 999));
                if (minOrderA !== minOrderB) return minOrderA - minOrderB;
                const minIdA = Math.min(...Array.from(deptA.values()).flat().map(d => d.originalId || d.id));
                const minIdB = Math.min(...Array.from(deptB.values()).flat().map(d => d.originalId || d.id));
                return minIdA - minIdB;
            });

            const sortedDeptData = [];
            sortedDeptNames.forEach(deptName => {
                const divMap = deptMap.get(deptName);
                const sortedDivNames = Array.from(divMap.keys()).sort((a, b) => {
                    const unitsA = divMap.get(a), unitsB = divMap.get(b);
                    const minOrderA = Math.min(...unitsA.map(d => d.displayOrder !== undefined ? d.displayOrder : 999));
                    const minOrderB = Math.min(...unitsB.map(d => d.displayOrder !== undefined ? d.displayOrder : 999));
                    if (minOrderA !== minOrderB) return minOrderA - minOrderB;
                    const minIdA = Math.min(...unitsA.map(d => d.originalId || d.id));
                    const minIdB = Math.min(...unitsB.map(d => d.originalId || d.id));
                    return minIdA - minIdB;
                });
                const deptDivisions = [];
                sortedDivNames.forEach(divName => {
                    const units = divMap.get(divName);
                    units.sort((a, b) => {
                        const orderA = a.displayOrder !== undefined ? a.displayOrder : 999;
                        const orderB = b.displayOrder !== undefined ? b.displayOrder : 999;
                        if (orderA !== orderB) return orderA - orderB;
                        return (a.originalId || a.id) - (b.originalId || b.id);
                    });
                    deptDivisions.push({ divisionName: divName, units: units });
                });
                sortedDeptData.push({ departmentName: deptName, divisions: deptDivisions });
            });

            const schoolsByCluster = new Map();
            for (let i = 0; i < schoolsList.length; i++) {
                const school = schoolsList[i];
                const cluster = school.clusterNumber || 'Unassigned';
                if (!schoolsByCluster.has(cluster)) schoolsByCluster.set(cluster, []);
                schoolsByCluster.get(cluster).push(school);
            }
            const clusterOrder = ['CLUSTER 1', 'CLUSTER 2', 'CLUSTER 3', 'CLUSTER 4', 'CLUSTER 5', 'CLUSTER 6', 'Unassigned'];

            for (let c = 0; c < clusterOrder.length; c++) {
                const cluster = clusterOrder[c];
                const clusterSchools = schoolsByCluster.get(cluster);
                if (!clusterSchools || clusterSchools.length === 0) continue;
                let hasVisibleInCluster = false;
                const visibleClusterEntities = [];
                for (let i = 0; i < clusterSchools.length; i++) {
                    const entity = clusterSchools[i];
                    const visibleAccounts = [];
                    let hasAnyVisible = false;
                    for (let a = 0; a < entity.accountGroups.length; a++) {
                        const account = entity.accountGroups[a];
                        const meters = account.meters || [];
                        const visibleMeters = [];
                        if (meters.length === 0) {
                            visibleMeters.push({
                                meterNumber: '',
                                location: '',
                                notes: '',
                                existing: null,
                                billId: null,
                                isPlaceholder: true
                            });
                        } else {
                            for (let m = 0; m < meters.length; m++) {
                                const meter = meters[m];
                                const meterNum = meter.meterNumber || '';
                                // ===== IMPROVED MATCHING: try account-only first =====
                                let existing = null;
                                const accountMatches = existingBills.filter(bill => {
                                    const accNorm = (bill.account_number || '').replace(/[()\s\-]/g, '').trim();
                                    const accountNorm = (account.accountNumber || '').replace(/[()\s\-]/g, '').trim();
                                    return bill.entity_type === entity.type &&
                                        bill.entity_id === entity.id &&
                                        accNorm === accountNorm &&
                                        bill.month == month && bill.year == year;
                                });
                                if (accountMatches.length === 1) {
                                    existing = accountMatches[0];
                                } else {
                                    existing = existingBills.find(bill => {
                                        const accNorm = (bill.account_number || '').replace(/[()\s\-]/g, '').trim();
                                        const meterNorm = (bill.meter_number || '').replace(/[()\s\-]/g, '').trim();
                                        const accountNorm = (account.accountNumber || '').replace(/[()\s\-]/g, '').trim();
                                        const meterNumNorm = (meterNum || '').replace(/[()\s\-]/g, '').trim();
                                        return bill.entity_type === entity.type &&
                                            bill.entity_id === entity.id &&
                                            accNorm === accountNorm &&
                                            meterNorm === meterNumNorm &&
                                            bill.month == month && bill.year == year;
                                    });
                                }
                                // ===== END IMPROVED MATCHING =====

                                if (statusFilter === 'all' ||
                                    (statusFilter === 'paid' && existing && (existing.amount_paid || 0) > 0) ||
                                    (statusFilter === 'pending' && (!existing || (existing.amount_paid || 0) === 0))) {
                                    visibleMeters.push({
                                        meterNumber: meterNum,
                                        location: meter.location || '',
                                        notes: meter.notes || '',
                                        existing: existing,
                                        billId: existing ? existing.id : null,
                                        isPlaceholder: false
                                    });
                                }
                            }
                        }
                        if (visibleMeters.length > 0) {
                            hasAnyVisible = true;
                            visibleAccounts.push({
                                accountNumber: account.accountNumber,
                                meters: visibleMeters,
                                isPlaceholder: account.isPlaceholder
                            });
                        }
                    }
                    if (hasAnyVisible) {
                        hasVisibleInCluster = true;
                        const entityCopy = JSON.parse(JSON.stringify(entity));
                        entityCopy.accountGroups = visibleAccounts;
                        visibleClusterEntities.push(entityCopy);
                    }
                }

                if (hasVisibleInCluster && visibleClusterEntities.length > 0) {
                    let totalMeters = 0;
                    for (let i = 0; i < visibleClusterEntities.length; i++) {
                        const e = visibleClusterEntities[i];
                        for (let a = 0; a < e.accountGroups.length; a++) totalMeters += e.accountGroups[a].meters.length;
                    }
                    const separatorRow = document.createElement('tr');
                    separatorRow.className = 'cluster-separator';
                    separatorRow.innerHTML = '<td colspan="12"><div class="cluster-info"><span>🏫 ' + cluster + '</span><span class="cluster-count">' + visibleClusterEntities.length + ' entit' + (visibleClusterEntities.length > 1 ? 'ies' : 'y') + ', ' + totalMeters + ' meter' + (totalMeters > 1 ? 's' : '') + '</span></div></td>';
                    tbody.appendChild(separatorRow);
                    for (let i = 0; i < visibleClusterEntities.length; i++) {
                        globalSerial = await renderEntity(tbody, visibleClusterEntities[i], month, year, globalSerial, entityNumber);
                        entityNumber++;
                    }
                }
            }

            for (const deptData of sortedDeptData) {
                const deptName = deptData.departmentName;
                const divisions = deptData.divisions;
                let totalAccountsInDept = 0, totalUnitsInDept = 0;
                divisions.forEach(div => {
                    totalUnitsInDept += div.units.length;
                    div.units.forEach(unit => totalAccountsInDept += unit.accountGroups.length);
                });
                const deptSep = document.createElement('tr');
                deptSep.className = 'department-group-separator';
                deptSep.innerHTML = `<td colspan="12"><div class="dept-group-info"><span class="department-name-badge">🏢 ${escapeHtml(deptName)}</span><span class="dept-group-count">${totalUnitsInDept} unit${totalUnitsInDept>1?'s':''}, ${totalAccountsInDept} account${totalAccountsInDept>1?'s':''}</span></div></td>`;
                tbody.appendChild(deptSep);
                for (const divData of divisions) {
                    const units = divData.units;
                    for (const entity of units) {
                        globalSerial = await renderEntity(tbody, entity, month, year, globalSerial, entityNumber);
                        entityNumber++;
                    }
                }
            }

            restoreScrollPosition();
            isLoading = false;
            showLoading(false);
        }

        async function renderEntity(tbody, entity, month, year, startSerial, entityNumber) {
            let serial = startSerial;
            let entityTotalPaid = 0;
            let entityHasBills = false;
            let isFirstMeter = true;
            let meterRowsData = [];

            for (let a = 0; a < entity.accountGroups.length; a++) {
                const account = entity.accountGroups[a];
                let isFirstMeterForAccount = true;
                for (let m = 0; m < account.meters.length; m++) {
                    const meter = account.meters[m];
                    const existing = meter.existing;
                    let parsedNotes = {};
                    if (existing && existing.notes && existing.notes.startsWith('{')) {
                        try { parsedNotes = JSON.parse(existing.notes); } catch(e) {}
                    }

                    let consumption = 0;
                    let currentCharges = 0;
                    let outstandingCharges = 0;
                    let amountPaid = 0;

                    if (existing) {
                        consumption = existing.consumption_m3 || 0;
                        currentCharges = existing.current_charges || 0;
                        outstandingCharges = existing.unsettled_charges || 0;
                        amountPaid = existing.amount_paid || 0;
                    }

                    let previousPayment = parsedNotes.previousPayment || 0;
                    let notes = parsedNotes.originalNotes || meter.notes || '';
                    entityTotalPaid += amountPaid;
                    if (existing && amountPaid > 0) entityHasBills = true;

                    const locationDisplay = meter.location ? '<div style="font-size:0.7rem; color:var(--gray);">📍 ' + escapeHtml(meter.location) + '</div>' : '';
                    const displayMeter = meter.meterNumber || '—';

                    const accountNumber = account.accountNumber || account.account_number || '';

                    meterRowsData.push({
                        serial: serial,
                        accountNumber: accountNumber,
                        meterNumber: meter.meterNumber,
                        displayMeter: displayMeter,
                        locationDisplay: locationDisplay,
                        consumption: consumption,
                        currentCharges: currentCharges,
                        outstandingCharges: outstandingCharges,
                        previousPayment: previousPayment,
                        amountPaid: amountPaid,
                        notes: notes,
                        billId: meter.billId,
                        isFirstMeterForAccount: isFirstMeterForAccount,
                        existingBill: existing
                    });

                    isFirstMeterForAccount = false;
                    serial++;
                }
            }

            let entityStatusClass = 'status-pending';
            let entityStatusText = 'Pending';
            if (entityHasBills) { entityStatusText = 'Paid'; entityStatusClass = 'status-paid'; }
            else if (entityTotalPaid === 0) { entityStatusText = 'Not entered'; }
            else { entityStatusText = 'Partially Paid'; entityStatusClass = 'status-partial'; }

            const entityRow = document.createElement('tr');
            entityRow.className = 'entity-row';
            entityRow.setAttribute('data-entity-type', entity.type);
            entityRow.setAttribute('data-entity-id', entity.id);
            entityRow.setAttribute('data-entity-name', entity.name);

            entityRow.innerHTML = '<td class="seq-number">' + entityNumber + '</td>' +
                '<td class="entity-header"><span class="entity-name">' + escapeHtml(entity.name) + '</span>' +
                '<span class="total-due" id="entity-total-' + entity.id + '">(Total Paid: $' + formatNumberWithCommas(entityTotalPaid) + ')</span>' +
                '</td>' +
                '<td><span class="badge ' + (entity.type === 'school' ? 'badge-school' : 'badge-department') + '">' + entity.typeLabel + '</span></td>' +
                '<td colspan="6"></td>' +
                '<td></td>' +
                '<td><span class="status-badge ' + entityStatusClass + '" id="entity-status-' + entity.id + '">' + entityStatusText + '</span></td>' +
                '<td class="entity-actions"><button class="btn btn-success btn-sm save-entity-btn">Save All</button></td>';
            tbody.appendChild(entityRow);

            let currentAccount = null;
            let meterRowElements = [];

            for (let i = 0; i < meterRowsData.length; i++) {
                const meterData = meterRowsData[i];
                const accountNum = meterData.accountNumber;

                if (currentAccount !== null && currentAccount !== accountNum) {
                    const accountDisplay = accountNum && accountNum !== '—' ? accountNum : 'No Account';
                    const separatorRow = document.createElement('tr');
                    separatorRow.className = 'account-separator';
                    separatorRow.innerHTML = '<td colspan="12"><div class="account-label">▸ Account: <span class="acct-num">' + escapeHtml(accountDisplay) + '</span></div></td>';
                    tbody.appendChild(separatorRow);
                }

                if (currentAccount === null) {
                    currentAccount = accountNum;
                    const accountDisplay = accountNum && accountNum !== '—' ? accountNum : 'No Account';
                    const separatorRow = document.createElement('tr');
                    separatorRow.className = 'account-separator';
                    separatorRow.innerHTML = '<td colspan="12"><div class="account-label">▸ Account: <span class="acct-num">' + escapeHtml(accountDisplay) + '</span></div></td>';
                    tbody.appendChild(separatorRow);
                }

                const meterRow = document.createElement('tr');
                meterRow.className = 'meter-row';
                meterRow.setAttribute('data-account', escapeHtml(meterData.accountNumber));
                meterRow.setAttribute('data-meter', escapeHtml(meterData.meterNumber));
                if (meterData.billId) meterRow.setAttribute('data-bill-id', meterData.billId);

                let amountPaidHtml = '';
                if (isFirstMeter) {
                    amountPaidHtml = '<input type="text" class="inline-input amount-paid-input" value="' + formatNumberWithCommas(meterData.amountPaid) + '" placeholder="$">';
                    isFirstMeter = false;
                } else {
                    amountPaidHtml = '<div class="amount-paid-disabled">—</div>';
                }

                let accountDisplayHtml = '';
                if (meterData.isFirstMeterForAccount) {
                    if (meterData.accountNumber && meterData.accountNumber !== '—') {
                        accountDisplayHtml = '<div><span class="account-number">📋 ' + escapeHtml(meterData.accountNumber) + '</span></div>';
                    } else {
                        accountDisplayHtml = '<div><span class="account-number placeholder-text">📋 No account number</span></div>';
                    }
                }

                const currentChargesDisplay = meterData.currentCharges || 0;
                const outstandingDisplay = meterData.outstandingCharges || 0;
                const consumptionDisplay = meterData.consumption || 0;

                meterRow.innerHTML = 
                    '<td class="seq-number">—</td>' +
                    '<td></td>' +
                    '<td></td>' +
                    '<td>' + accountDisplayHtml +
                        '<div class="meter-number">🔢 Meter: ' + escapeHtml(meterData.displayMeter) + '</div>' +
                        meterData.locationDisplay +
                    '</td>' +
                    '<td style="text-align:right;"><input type="text" class="inline-input consumption-input" value="' + formatConsumption(consumptionDisplay) + '" placeholder="m³"></td>' +
                    '<td style="text-align:right;"><input type="text" class="inline-input current-charge-input" value="' + formatNumberWithCommas(currentChargesDisplay) + '" placeholder="$"></td>' +
                    '<td style="text-align:right;"><input type="text" class="inline-input outstanding-input" value="' + formatNumberWithCommas(outstandingDisplay) + '" placeholder="$"></td>' +
                    '<td style="text-align:right;"><input type="text" class="inline-input previous-paid-input" value="' + formatNumberWithCommas(meterData.previousPayment) + '" placeholder="$"></td>' +
                    '<td style="text-align:right;" class="amount-paid-cell">' + amountPaidHtml + '</td>' +
                    '<td class="notes-cell"><input type="text" class="inline-input notes-input" value="' + escapeHtml(meterData.notes) + '" placeholder="Notes..."></td>' +
                    '<td style="text-align:center;"></td>' +
                    '<td style="text-align:center;"></td>';
                tbody.appendChild(meterRow);
                meterRowElements.push(meterRow);

                const consumptionInput = meterRow.querySelector('.consumption-input');
                if (consumptionInput) {
                    consumptionInput.addEventListener('blur', function() {
                        if (this.value && this.value.trim() !== '') {
                            const raw = parseNumberFromDisplay(this.value);
                            this.value = formatConsumption(raw);
                        }
                    });
                    consumptionInput.addEventListener('focus', function() {
                        const raw = parseNumberFromDisplay(this.value);
                        this.value = raw.toString();
                    });
                }

                const otherNumericInputs = meterRow.querySelectorAll('.inline-input:not(.notes-input):not(.consumption-input)');
                otherNumericInputs.forEach(inp => {
                    inp.addEventListener('blur', function() {
                        if (this.value && this.value.trim() !== '') {
                            const raw = parseNumberFromDisplay(this.value);
                            this.value = formatNumberWithCommas(raw);
                        }
                    });
                    inp.addEventListener('focus', function() {
                        const raw = parseNumberFromDisplay(this.value);
                        this.value = raw.toString();
                    });
                });

                currentAccount = accountNum;
            }

            let totalConsumption = 0, totalBillAmount = 0, totalOutstanding = 0;
            meterRowsData.forEach(m => {
                totalConsumption += m.consumption;
                totalBillAmount += m.currentCharges;
                totalOutstanding += m.outstandingCharges;
            });

            const summaryRow = document.createElement('tr');
            summaryRow.className = 'entity-summary-row';
            summaryRow.setAttribute('data-entity-id', entity.id);
            summaryRow.innerHTML = `
                <td class="summary-label" style="text-align:center;">Total</td>
                <td colspan="3" style="text-align:center;"></td>
                <td class="summary-total" id="summary-consumption-${entity.id}" style="text-align:center;">${formatConsumption(totalConsumption)}</td>
                <td class="summary-total" id="summary-bill-${entity.id}" style="text-align:center;">${formatNumberWithCommas(totalBillAmount)}</td>
                <td class="summary-total" id="summary-outstanding-${entity.id}" style="text-align:center;">${formatNumberWithCommas(totalOutstanding)}</td>
                <td class="summary-dash" style="text-align:center;">—</td>
                <td class="summary-dash" style="text-align:center;">—</td>
                <td style="text-align:center;"></td>
                <td style="text-align:center;"></td>
                <td style="text-align:center;"></td>
            `;
            tbody.appendChild(summaryRow);

            meterRowElements.forEach(row => {
                const consumptionInput = row.querySelector('.consumption-input');
                const billInput = row.querySelector('.current-charge-input');
                const outstandingInput = row.querySelector('.outstanding-input');
                const updateFunction = function() {
                    let totalCons = 0, totalBill = 0, totalOut = 0;
                    meterRowElements.forEach(mRow => {
                        const cInput = mRow.querySelector('.consumption-input');
                        const bInput = mRow.querySelector('.current-charge-input');
                        const oInput = mRow.querySelector('.outstanding-input');
                        totalCons += parseNumberFromDisplay(cInput ? cInput.value : 0);
                        totalBill += parseNumberFromDisplay(bInput ? bInput.value : 0);
                        totalOut += parseNumberFromDisplay(oInput ? oInput.value : 0);
                    });
                    const summaryCons = document.getElementById(`summary-consumption-${entity.id}`);
                    const summaryBill = document.getElementById(`summary-bill-${entity.id}`);
                    const summaryOut = document.getElementById(`summary-outstanding-${entity.id}`);
                    if (summaryCons) summaryCons.textContent = formatConsumption(totalCons);
                    if (summaryBill) summaryBill.textContent = formatNumberWithCommas(totalBill);
                    if (summaryOut) summaryOut.textContent = formatNumberWithCommas(totalOut);
                };
                if (consumptionInput) consumptionInput.addEventListener('input', updateFunction);
                if (billInput) billInput.addEventListener('input', updateFunction);
                if (outstandingInput) outstandingInput.addEventListener('input', updateFunction);
            });

            return serial;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function attachEventListeners() {
            document.getElementById('billsTableBody').addEventListener('click', async function(e) {
                const saveBtn = e.target.closest('.save-entity-btn');
                if (saveBtn && !saveBtn.disabled) {
                    const entityRow = saveBtn.closest('tr.entity-row');
                    if (entityRow) {
                        await saveEntityDataBackground(entityRow, currentMonth, currentYear);
                    }
                    return;
                }
            });

            const monthSelect = document.getElementById('globalMonth');
            const yearSelect = document.getElementById('globalYear');
            monthSelect.addEventListener('change', function() {
                const month = parseInt(this.value);
                const year = parseInt(document.getElementById('globalYear').value);
                renderWaterTable(month, year);
            });
            yearSelect.addEventListener('change', function() {
                const month = parseInt(document.getElementById('globalMonth').value);
                const year = parseInt(this.value);
                renderWaterTable(month, year);
            });
        }

        document.addEventListener('DOMContentLoaded', async function() {
            populateYears();
            const now = new Date();
            const monthSelect = document.getElementById('globalMonth');
            const yearSelect = document.getElementById('globalYear');
            if (monthSelect) monthSelect.value = now.getMonth() + 1;
            if (yearSelect) yearSelect.value = now.getFullYear();
            attachEventListeners();
            await renderWaterTable();
            const refreshBtn = document.getElementById('refreshTableBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', async function() {
                    await renderWaterTable();
                });
            }
            const applyFiltersBtn = document.getElementById('applyFiltersBtn');
            if (applyFiltersBtn) {
                applyFiltersBtn.addEventListener('click', async function() {
                    await renderWaterTable();
                });
            }
        });
    </script>
</body>
</html>
